name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OrcaSlicer runs on all three; the plugin touches paths and files.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          # OrcaSlicer 2.5 embeds CPython 3.12.
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build --wheel
      - name: Check the wheel is one OrcaSlicer can load
        run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
